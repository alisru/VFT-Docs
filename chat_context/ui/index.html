<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat Context</title>
<style>
  :root { --bg:#14161a; --panel:#1b1e24; --line:#2c313a; --text:#d8dce3; --dim:#8a919e; --acc:#6aa9ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, sans-serif; height:100vh; display:grid; grid-template-rows:auto 1fr auto; }
  header { display:flex; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  header input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:6px 10px; border-radius:6px; }
  button { background:var(--bg); border:1px solid var(--line); color:var(--text); padding:5px 10px; border-radius:6px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.on { background:var(--acc); color:#000; border-color:var(--acc); }
  main { display:grid; grid-template-columns:300px 1fr 260px; min-height:0; }
  aside, section { overflow:auto; min-height:0; }
  aside { border-right:1px solid var(--line); background:var(--panel); padding:8px; }
  #related { border-left:1px solid var(--line); border-right:0; }
  .tabs { display:flex; gap:4px; margin-bottom:8px; }
  .topic { margin:6px 0; }
  .topic > .th { color:var(--acc); font-weight:600; cursor:pointer; display:flex; justify-content:space-between; gap:6px; }
  .chat { padding:3px 6px; border-radius:4px; cursor:pointer; display:flex; gap:6px; align-items:flex-start; }
  .chat:hover, .chat.sel { background:#262b34; }
  .chat .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat small { color:var(--dim); }
  section { padding:16px 24px; }
  .msg { margin:0 0 14px; padding:10px 14px; border-radius:8px; border:1px solid var(--line); white-space:pre-wrap; word-break:break-word; }
  .msg.user { background:#1e2733; }
  .msg .r { color:var(--dim); font-size:12px; margin-bottom:4px; }
  .hit { margin:0 0 12px; padding:10px 14px; border:1px solid var(--line); border-radius:8px; white-space:pre-wrap; }
  .hit h4 { margin:0 0 4px; color:var(--acc); cursor:pointer; font-size:13px; }
  footer { display:flex; gap:8px; padding:8px 12px; border-top:1px solid var(--line); background:var(--panel); align-items:center; }
  footer input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:6px 10px; border-radius:6px; }
  .dim { color:var(--dim); }
  h3 { margin:0 0 8px; }
  .badge { font-size:10px; padding:1px 4px; border-radius:3px; font-weight:600; text-transform:uppercase; flex-shrink:0; }
  .badge.gemini { background:#3b2a68; color:#bca4ff; }
  .badge.chatgpt { background:#163e32; color:#5eead4; }
  .badge.claude { background:#4a2618; color:#fdba74; }
  .badge.antigravity { background:#1e3a5f; color:#93c5fd; }
  .badge.file, .badge.json { background:#2a2f3a; color:#a0aec0; }
  .web-link { color:var(--acc); margin-left:10px; font-size:12px; text-decoration:none; }
  .web-link:hover { text-decoration:underline; }
</style>
</head>
<body>
<header>
  <input id="q" placeholder="Search all chats by meaning, press Enter">
  <button id="sync">Sync</button>
  <span id="status" class="dim" style="align-self:center"></span>
</header>
<main>
  <aside id="side">
    <div class="tabs">
      <button data-v="recent">Recent</button>
      <button data-v="all">All</button>
      <button data-v="topics" class="on">Topics</button>
    </div>
    <div id="list"></div>
  </aside>
  <section id="main"><p class="dim">Pick a chat, or search.</p></section>
  <aside id="related"><h3>Related</h3><div id="rel"></div></aside>
</main>
<footer>
  <span id="count" class="dim">0 chats selected</span>
  <input id="pq" placeholder="Optional: focus the pack on a question (picks the best excerpts)">
  <button id="pack">Copy context pack</button>
  <button id="clear">Clear</button>
</footer>
<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let data = null, view = localStorage.getItem('chat_ctx_tab') || 'recent', current = null, picked = new Set();

async function api(path, opts) { const r = await fetch(path, opts); if (!r.ok) throw new Error(path + ' ' + r.status); return r; }
const post = (p, b) => api(p, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b) });

async function load() { data = await (await api('/api/tree')).json(); renderList(); }

function chatRow(c) {
  const row = el('div', 'chat' + (current === c.id ? ' sel' : ''));
  const cb = el('input'); cb.type = 'checkbox'; cb.checked = picked.has(c.id);
  cb.onclick = e => { e.stopPropagation(); cb.checked ? picked.add(c.id) : picked.delete(c.id); $('#count').textContent = picked.size + ' chats selected'; };
  const src = (c.source || 'file').toLowerCase();
  const badge = el('span', 'badge ' + src, src.slice(0, 3));
  const t = el('div', 't', c.title || c.id); t.title = c.title || c.id;
  row.append(cb, badge, t, el('small', null, (c.updated || '').slice(5, 10)));
  row.onclick = () => openChat(c.id);
  return row;
}

function renderList() {
  const box = $('#list'); box.replaceChildren();
  if (!data) return;
  if (view === 'recent') data.recent.forEach(c => box.append(chatRow(c)));
  else if (view === 'all') data.all.forEach(c => box.append(chatRow(c)));
  else {
    data.topics.forEach(t => {
      const d = el('div', 'topic'), h = el('div', 'th');
      h.append(el('span', null, `${t.name} (${t.chats.length})`));
      const pk = el('button', null, 'pack'); pk.onclick = async e => { e.stopPropagation(); copyPack({ topic_id:t.id, query:$('#pq').value }); };
      h.append(pk);
      h.ondblclick = async () => { const n = prompt('Rename topic', t.name); if (n) { await post('/api/topic/rename', { id:t.id, name:n }); load(); } };
      h.title = 'double-click to rename';
      const body = el('div'); t.chats.forEach(c => body.append(chatRow(c)));
      h.onclick = () => body.hidden = !body.hidden;
      d.append(h, body); box.append(d);
    });
    if (data.unsorted.length) { const d = el('div', 'topic'); d.append(el('div', 'th', `Unsorted (${data.unsorted.length})`)); data.unsorted.forEach(c => d.append(chatRow(c))); box.append(d); }
  }
}

async function openChat(id) {
  current = id; renderList();
  const c = await (await api('/api/chat/' + id)).json();
  const m = $('#main'); m.replaceChildren();
  const h = el('h3', null, c.title);
  const actions = el('div', null);
  const mv = el('button', null, 'Move to topic');
  mv.onclick = async () => {
    const names = data.topics.map(t => `${t.id}: ${t.name}`).join('\n');
    const a = prompt('Topic id to move to, or type a new topic name:\n' + names);
    if (!a) return;
    await post('/api/chat/move', /^\d+$/.test(a.trim()) ? { chat_id:id, topic_id:+a } : { chat_id:id, new_topic:a });
    load();
  };
  actions.append(mv);
  if (c.url) {
    const link = el('a', 'web-link', '🔗 Open on Web');
    link.href = c.url; link.target = '_blank'; link.rel = 'noreferrer';
    actions.append(link);
  }
  const meta = el('p', 'dim', `${c.source.toUpperCase()} · ${(c.started || '').slice(0, 10)} · ${c.messages.length} messages`);
  m.append(h, actions, meta);
  c.messages.forEach(x => { const d = el('div', 'msg ' + x.role); d.append(el('div', 'r', x.role), document.createTextNode(x.text)); m.append(d); });
  m.scrollTop = 0;
  const rel = await (await api('/api/related/' + id)).json();
  const r = $('#rel'); r.replaceChildren();
  rel.forEach(x => {
    const wrap = el('div');
    const d = chatRow({ id:x.id, title:x.title, updated:x.updated }); d.append(el('small', null, x.score));
    wrap.append(d);
    if (x.why) {
      const w = el('div', 'dim', 'shared: ' + (x.why.shared.join(', ') || 'similar meaning, no common words'));
      w.style.cssText = 'font-size:12px;margin:0 0 6px 24px;cursor:help';
      w.title = `This chat:\n${x.why.this}\n\nThat chat:\n${x.why.other}`;
      wrap.append(w);
    }
    r.append(wrap);
  });
}

async function doSearch() {
  const q = $('#q').value.trim(); if (!q) return;
  $('#status').textContent = 'searching…';
  const hits = await (await api('/api/search?q=' + encodeURIComponent(q))).json();
  const m = $('#main'); m.replaceChildren(el('h3', null, `Results for "${q}"`));
  hits.forEach(h => { const d = el('div', 'hit'); const t = el('h4', null, `${h.title} · ${h.score}`); t.onclick = () => openChat(h.chat_id); d.append(t, document.createTextNode(h.text)); m.append(d); });
  $('#status').textContent = '';
}

async function copyPack(body) {
  const txt = await (await post('/api/pack', body)).text();
  await navigator.clipboard.writeText(txt);
  $('#status').textContent = `copied ${txt.length} chars`;
}

document.querySelectorAll('.tabs button').forEach(b => {
  b.classList.toggle('on', b.dataset.v === view);
  b.onclick = () => {
    view = b.dataset.v;
    localStorage.setItem('chat_ctx_tab', view);
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    renderList();
  };
});
$('#q').onkeydown = e => { if (e.key === 'Enter') doSearch(); };
$('#sync').onclick = async () => { await post('/api/sync?threshold=0.80', {}); $('#status').textContent = 'sync queued'; };
let lastState = 'idle';
async function poll() {
  try {
    const s = await (await api('/api/status')).json();
    if (s.state !== 'idle') $('#status').textContent = s.state === 'embedding' ? `embedding ${s.done}/${s.total} chats…` : s.state + '…';
    else if (lastState !== 'idle') { $('#status').textContent = s.error ? 'sync error: ' + s.error : 'up to date'; load(); }
    lastState = s.state;
  } catch (e) {}
  setTimeout(poll, 2000);
}
poll();
$('#pack').onclick = () => { if (!picked.size && !$('#pq').value.trim()) { $('#status').textContent = 'pick chats or type a question'; return; } copyPack({ chat_ids:[...picked], query:$('#pq').value }); };
$('#clear').onclick = () => { picked.clear(); $('#count').textContent = '0 chats selected'; renderList(); };
load();
</script>
</body>
</html>
