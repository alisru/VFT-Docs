name: Bluesky Judgement Bot Cron

on:
  schedule:
    # Runs every day at 14:00 UTC (Modify as needed)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows you to manually trigger the run from the GitHub UI

jobs:
  run_bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure matplotlib and atproto are installed, as well as the LLM SDK you choose to use
          pip install atproto matplotlib python-dotenv google-genai

      - name: Run Bluesky Bot
        env:
          # These must be set in your GitHub Repository Settings -> Secrets and variables -> Actions
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: ./bluesky_bot
        run: |
          # Replace 'post_live.py' with the final script that actually calls the LLM,
          # parses the news, generates the graph, and posts.
          python post_live.py
