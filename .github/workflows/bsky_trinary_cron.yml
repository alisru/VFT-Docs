name: Bluesky Trinary Synthesis Cron

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  run-trinary-loop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Trinary Synthesis Cron
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          # 1. Search for live verified news agency posts matching keyword 'US' or 'Energy'
          # 2. Spawn trinary agents concurrently to fact-check, cite, and audit
          # 3. Post the synthesized thread live to Bluesky as a reply
          python -m bluesky_bot.orchestrator --news-query "US" --feed "https://bsky.app/profile/aendra.com/feed/verified-news" --live
