<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auto-Scribe</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 330px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 12px;
      user-select: none;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 14px;
    }
    .badge-status {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      font-weight: 500;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .stat-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-lbl {
      font-size: 11px;
      color: var(--text-dim);
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }
    .recent-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      max-height: 160px;
      overflow-y: auto;
    }
    .recent-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .recent-top {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }
    .recent-title {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 190px;
    }
    .recent-preview {
      font-size: 11px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-main {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-main:hover {
      background: var(--accent-hover);
    }
    /* Simple switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>✍️</span>
      <span>Auto-Scribe</span>
    </div>
    <span class="badge-status" id="status-badge">Active</span>
  </header>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-val" id="stat-drafts">0</div>
      <div class="stat-lbl">Active Drafts</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-posted" style="color:var(--success);">0</div>
      <div class="stat-lbl">Posted</div>
    </div>
  </div>

  <div class="toggle-row">
    <span>Auto-Scribe Monitoring</span>
    <label class="switch">
      <input type="checkbox" id="toggle-enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="recent-header">Recent Unposted Drafts</div>
  <div class="recent-list" id="recent-list">
    <div style="color:var(--text-dim);font-size:12px;text-align:center;padding:12px;">Loading...</div>
  </div>

  <button class="btn-main" id="btn-dashboard">
    <span>Open Scribe Dashboard</span>
    <span>↗</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
